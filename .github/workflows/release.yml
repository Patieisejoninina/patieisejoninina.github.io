name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          AA0A85: ${{ secrets.AA0A85 }}
          B782D2: ${{ secrets.B782D2 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('AA0A85', '')
          k2 = os.environ.get('B782D2', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- 43fd06f71d984ab383a237 -->', k1) if k1 else txt
          out = out.replace('<!-- 22acc4f47935114e5d2ac604bce0b5529e218333 -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
